<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Biz Voice AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background:
                radial-gradient(circle at top left, #dbeafe, transparent 35%),
                radial-gradient(circle at bottom right, #ede9fe, transparent 35%),
                #f8fafc;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 45px 40px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e5e7eb;
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(15, 23, 42, 0.12);

            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #111827;
            color: white;
            border-radius: 20px;

            font-size: 32px;

            box-shadow: 0 10px 25px rgba(17, 24, 39, 0.2);
        }

        h1 {
            font-size: 38px;
            color: #111827;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .input-label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 16px 18px;

            border: 1px solid #d1d5db;
            border-radius: 12px;

            font-size: 16px;
            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            flex: 1;

            padding: 14px 20px;

            border: none;
            border-radius: 12px;

            cursor: pointer;
            font-size: 16px;
            font-weight: bold;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .ask-button {
            background: #111827;
            color: white;

            box-shadow: 0 8px 18px rgba(17, 24, 39, 0.18);
        }

        .ask-button:hover {
            background: #1f2937;
        }

        .voice-button {
            background: #eef2ff;
            color: #4338ca;
        }

        .voice-button:hover {
            background: #e0e7ff;
        }

        #status {
            min-height: 24px;
            margin-top: 20px;

            color: #64748b;
            font-size: 14px;
        }

        .answer-box {
            margin-top: 22px;
            padding: 22px;

            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;

            text-align: left;
        }

        .answer-title {
            margin-bottom: 10px;

            font-size: 14px;
            font-weight: bold;
            color: #475569;
        }

        #answer {
            color: #1e293b;
            line-height: 1.7;
            font-size: 16px;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 22px;
            }

            h1 {
                font-size: 30px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            🎙️
        </div>

        <h1>Biz Voice AI</h1>

        <p class="subtitle">
            Your AI-powered business assistant
        </p>

        <label class="input-label" for="question">
            Ask your business question
        </label>

        <input
            type="text"
            id="question"
            placeholder="e.g. What services do you offer?"
        >

        <div class="buttons">

            <button class="ask-button" onclick="askAI()">
                Ask AI
            </button>

            <button class="voice-button" onclick="startListening()">
                🎤 Speak
            </button>

        </div>

        <p id="status"></p>

        <div class="answer-box">

            <p class="answer-title">
                AI Response
            </p>

            <p id="answer">
                Your AI answer will appear here.
            </p>

        </div>

        <p class="footer">
            Powered by AI • Biz Voice AI
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
